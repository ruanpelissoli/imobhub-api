      - churrasqueiras
      - espaço gourmet
      - área de churrasco

  - canonical: portaria 24h
    synonyms:
      - portaria 24h
      - portaria 24 horas
      - portaria 24hs
      - portaria eletrônica
      - porteiro 24 horas
      - segurança 24 horas

  - canonical: elevador
    synonyms:
      - elevador
      - elevadores
      - elevador social

  - canonical: ar-condicionado
    synonyms:
      - ar condicionado
      - ar-condicionado
      - climatizado
      - climatização
      - split

  - canonical: varanda
    synonyms:
      - varanda
      - varandas
      - varanda gourmet
      - sacada
      - terraço

  - canonical: pet friendly
    synonyms:
      - pet friendly
      - aceita pets
      - aceita animais
      - permitido animais

  - canonical: salão de festas
    synonyms:
      - salão de festas
      - salao de festas
      - espaço festas
      - salão social

  - canonical: playground
    synonyms:
      - playground
