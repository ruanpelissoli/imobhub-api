# Vocabulário de comodidades reconhecidas pelo internal/enrichment.
#
# Cada item tem:
#   canonical — o nome que vai para listings.amenities / properties.amenities.
#               É o valor consultado depois, então mudá-lo é mudar o dado.
#   synonyms  — as grafias reconhecidas no texto livre do anúncio.
#
# O matching é case-insensitive, insensível a acento e tolerante à troca de
# hífen por espaço ("Ar-Condicionado" == "ar condicionado"). Portanto NÃO é
# preciso listar variações de caixa, de acento ou de hífen — só de palavra
# (singular/plural, sinônimo regional, apelido de mercado).
#
# A ORDEM DESTE ARQUIVO É A ORDEM DE SAÍDA de ExtractedData.Amenities. Ela é o
# contrato de determinismo dos testes: inserir no meio muda a ordem do resultado.
#
# Cada sinônimo é ancorado em limite de palavra, então precisa começar e
# terminar com caractere de palavra (letra ou dígito). "24h" vale; "24h." não.
#
# Não há tratamento de negação: "sem piscina" casa com piscina. Ver
# internal/enrichment/CLAUDE.md.

amenities:
  - canonical: piscina
    synonyms:
      - piscina
      - piscinas
      - piscina aquecida
      - piscina coberta

  - canonical: academia
    synonyms:
      - academia
      - espaço fitness
      - sala de ginástica
      - fitness center

  - canonical: churrasqueira
    synonyms:
